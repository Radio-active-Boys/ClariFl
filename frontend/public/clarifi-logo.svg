<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <!-- Gradient for the circular arc and bars -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ecfbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a6b;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for bars (teal to dark blue) -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3ecfbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d6fa8;stop-opacity:1" />
    </linearGradient>
    <!-- Star gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4dddd0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ab5c0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ===== ICON GROUP centered around (80, 80) ===== -->
  <g transform="translate(80,80)">

    <!-- Circular arc (open at top-right) -->
    <!-- Arc goes from about 300° to 240° (leaving a gap at top-right) -->
    <path d="
      M 0,-58
      A 58,58 0 1,0 50.2,-29
    " fill="none" stroke="url(#arcGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Bar chart: 4 bars of increasing height, centered -->
    <!-- Bar 1 (leftmost, shortest) -->
    <rect x="-27" y="-18" width="10" height="18" rx="2" fill="url(#barGrad)" opacity="0.85"/>
    <!-- Bar 2 -->
    <rect x="-14" y="-30" width="10" height="30" rx="2" fill="url(#barGrad)" opacity="0.9"/>
    <!-- Bar 3 -->
    <rect x="-1" y="-44" width="10" height="44" rx="2" fill="url(#barGrad)"/>
    <!-- Bar 4 (rightmost, tallest) -->
    <rect x="12" y="-54" width="10" height="54" rx="2" fill="url(#barGrad)"/>

    <!-- Sparkle / 4-point star at top-right of arc -->
    <!-- Positioned at roughly where the arc gap is: (29, -50) -->
    <g transform="translate(36,-52)">
      <path d="
        M 0,-9 C 1,-3 3,-1 9,0
        C 3,1 1,3 0,9
        C -1,3 -3,1 -9,0
        C -3,-1 -1,-3 0,-9 Z
      " fill="url(#starGrad)"/>
    </g>
  </g>

  <!-- ===== WORDMARK ===== -->
  <!-- "ClariFi" in dark navy, rounded sans-serif style -->
  <text
    x="155"
    y="103"
    font-family="'Trebuchet MS', 'Gill Sans', 'Century Gothic', sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-1"
    fill="#1e2d4a"
  >ClariFi</text>
</svg>
